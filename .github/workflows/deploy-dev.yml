name: Deploy Dev Environment (portfolio-dev)

on:
  push:
    branches:
      - infra-dev-setup
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: us-east-1
  STACK_NAME: portfolio-dev
  TEMPLATE_FILE: main-template.yaml # Using the relative path in the current directory
  BOOTSTRAP_STACK: bootstrap-stack
  FUNCTION_LOGICAL_ID: myLambdaFunction  # Logical ID in CF template

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Validate CloudFormation template
        run: |
          # Note: Using main-template.yaml from the root directory for simplicity
          aws cloudformation validate-template \
            --template-body file://main-template.yaml \
            --region ${{ env.REGION }}

      - name: Get artifact bucket from bootstrap stack
        id: get-bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.BOOTSTRAP_STACK }} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaContentS3BucketName'].OutputValue" \
            --output text --region ${{ env.REGION }})

          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "Using artifact bucket: $BUCKET"

      - name: Package Lambda Code
        run: |
          cd Projects/Website
          # Package the index.js file to include the latest logic
          zip -r dev-lambda.zip index.js node_modules
          ls -lh dev-lambda.zip
          echo "📦 Lambda package (dev-lambda.zip) created."

      - name: Upload Lambda ZIP to S3
        run: |
          aws s3 cp Projects/Website/dev-lambda.zip \
            s3://${{ steps.get-bucket.outputs.bucket }}/dev-lambda.zip \
            --region ${{ env.REGION }}
          echo "📤 Lambda code uploaded successfully."

      - name: Delete failed stack if exists
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "NONE")

          if [[ "$STATUS" == "ROLLBACK_COMPLETE" ]]; then
            echo "🧹 Deleting failed stack: ${{ env.STACK_NAME }}"
            aws cloudformation delete-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.REGION }}
            aws cloudformation wait stack-delete-complete \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.REGION }}
            echo "🗑️ Deleted failed stack."
          else
            echo "No failed stack found (status: $STATUS)"
          fi

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file main-template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn ${{ secrets.CFN_EXEC_ROLE_ARN }} \
            --region ${{ env.REGION }} \
            --parameter-overrides \
              myLambdacontentS3bucket=${{ steps.get-bucket.outputs.bucket }} \
              OidcRoleArn=${{ secrets.OIDC_ROLE_ARN }} \
              # CRITICAL FIX: Pass the Amplify URL to the CloudFormation parameter
              AmplifyWebAppOrigin=https://infra-dev-setup.d3ue8qsbe8o03n.amplifyapp.com 

          echo "🚀 CloudFormation deployment completed."

      - name: Update Lambda Function Code (without redeploying CloudFormation)
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --query "StackResources[?LogicalResourceId=='${{ env.FUNCTION_LOGICAL_ID }}'].PhysicalResourceId" \
            --output text --region ${{ env.REGION }})

          echo "🔁 Updating Lambda function ($FUNCTION_NAME)..."

          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket ${{ steps.get-bucket.outputs.bucket }} \
            --s3-key dev-lambda.zip \
            --region ${{ env.REGION }}

          echo "🎉 Lambda function code updated successfully!"

      - name: Sync Frontend to S3 (Portfolio Website)
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --query "StackResources[?LogicalResourceId=='myPortfolioContentS3bucket'].PhysicalResourceId" \
            --output text --region ${{ env.REGION }})

          echo "🌐 Uploading frontend files to: $FRONTEND_BUCKET"
          # Ensure you sync the correct build directory if using a framework. 
          # Assuming Projects/Website contains the build files for now.
          aws s3 sync Projects/Website s3://$FRONTEND_BUCKET --delete --region ${{ env.REGION }}
          echo "✨ Frontend website sync complete."
AWSTemplateFormatVersion: "2010-09-09"
Description: "Bootstrap stack — creates artifact bucket, CFN execution role, and GitHub OIDC role for CI/CD."

#S3 bucket for running code for lambda
Resources:

  myLambdacontentS3bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  myLambdacontentS3bucketpolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref myLambdacontentS3bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "ForMyLambdaBucket"
            Effect: "Allow"
            Principal:
              Service: 
                - cloudformation.amazonaws.com
                - lambda.amazonaws.com
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
            Resource:
              - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}/*"


  # OIDC IAM Role for GitHub Actions
  myOIDCIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myS3AccessRoleForGitHubActions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub: 
                  - "repo:RaseefAzeez/myportfolio_project:ref:refs/heads/main"
                  - "repo:RaseefAzeez/myportfolio_project:ref:refs/heads/infra-dev-setup"
      Policies:
        - PolicyName: S3AccessForGitHubActions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowS3Access
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:GetObjectVersion"
                Resource: 
                  - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}/*"
                  - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}"
              
              - Sid: AllowCFT
                Effect: Allow
                Action:
                  - "cloudformation:*"
                  - "iam:PassRole"
                  - "iam:GetRole"
                Resource: "*"

  # CloudFormation Execution Role
  myCFTExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  LambdaContentS3BucketName:
    Description: "Name of the S3 bucket for Lambda content"
    Value: !Ref myLambdacontentS3bucket
    Export:
      Name: !Sub "${AWS::StackName}-LambdaContentS3BucketName"

  OIDCRoleArn:
    Description: "ARN of the OIDC IAM Role for GitHub Actions"
    Value: !GetAtt myOIDCIAMRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OIDC-ROLE-ARN"

  CFTExecutionRoleARN:
    Description: "ARN of the CloudFormation Execution Role"
    Value: !GetAtt myCFTExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CFTExecutionRoleARN"

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap stack — creates:
  - S3 artifact bucket for Lambda packages
  - CloudFormation Execution Role
  - GitHub OIDC Role for CI/CD (GitHub Actions)

# ------------------------------------------------------------------------
# PARAMETERS
# ------------------------------------------------------------------------
Parameters:
  FrontendBucketName:
    Type: String
    Description: "Frontend S3 bucket name for website deployment (Used for explicit permissions)"

# ------------------------------------------------------------------------
# RESOURCES
# ------------------------------------------------------------------------
Resources:

  # ----------------------------------------------------------------------
  # S3 bucket for storing Lambda code artifacts
  # ----------------------------------------------------------------------
  myLambdacontentS3bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  myLambdacontentS3bucketpolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref myLambdacontentS3bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "ForMyLambdaBucket"
            Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
                - lambda.amazonaws.com
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
            Resource:
              - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}/*"

  # ----------------------------------------------------------------------
  # OIDC IAM Role for GitHub Actions
  # ----------------------------------------------------------------------
  myOIDCIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myS3AccessRoleForGitHubActions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - "repo:RaseefAzeez/myportfolio_project:ref:refs/heads/main"
                  - "repo:RaseefAzeez/myportfolio_project:ref:refs/heads/infra-dev-setup"

      Policies:
        - PolicyName: DeploymentAccessForGitHubActions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowS3BucketAccess
                Effect: Allow
                Action:
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource:
                  - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}"
                  - !Sub "arn:aws:s3:::${FrontendBucketName}"
                  - "arn:aws:s3:::portfolio-dev-myportfoliocontents3bucket-*"

              - Sid: AllowS3ObjectAccess
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "arn:aws:s3:::${myLambdacontentS3bucket}/*"
                  - !Sub "arn:aws:s3:::${FrontendBucketName}/*"
                  - "arn:aws:s3:::portfolio-dev-myportfoliocontents3bucket-*/*"

              - Sid: AllowLambdaUpdate
                Effect: Allow
                Action:
                  - "lambda:UpdateFunctionCode"
                Resource: "*"

              - Sid: AllowCloudFormationAndIAM
                Effect: Allow
                Action:
                  - "cloudformation:*"
                  - "iam:PassRole"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                Resource: "*"

  # ----------------------------------------------------------------------
  # CloudFormation Execution Role (for deploying stacks)
  # ----------------------------------------------------------------------
  myCFTExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

# ------------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------------
Outputs:
  LambdaContentS3BucketName:
    Description: "Name of the S3 bucket for Lambda content"
    Value: !Ref myLambdacontentS3bucket
    Export:
      Name: !Sub "${AWS::StackName}-LambdaContentS3BucketName"

  OIDCRoleArn:
    Description: "ARN of the OIDC IAM Role for GitHub Actions"
    Value: !GetAtt myOIDCIAMRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OIDC-ROLE-ARN"

  CFTExecutionRoleARN:
    Description: "ARN of the CloudFormation Execution Role"
    Value: !GetAtt myCFTExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CFTExecutionRoleARN"

# This is a YAML file for creating a CloudFormation stack with API Gateway, Lambda, DynamoDB, and SNS for GitSync
# Initial CloudFormation template

AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for creating AWS services for my portfolio website"

Resources:

  # API Gateway Resource and Method Definition
  RestAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: myApiusingCF
      Description: "API Gateway for contact form submission"

  submitResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestAPI
      ParentId: !GetAtt RestAPI.RootResourceId
      PathPart: submit

  myPOSTMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref submitResource
      RestApiId: !Ref RestAPI
      AuthorizationType: NONE
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${myLambdaFunction.Arn}/invocations"

  myOPTIONMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: OPTIONS
      ResourceId: !Ref submitResource
      RestApiId: !Ref RestAPI
      AuthorizationType: NONE
      RequestParameters:
        method.request.header.myheader: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        RequestParameters:
          integration.request.header.header1: method.request.header.myheader
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Origin: "'https://${myPortfolioContentS3bucket}.s3-website-${AWS::Region}.amazonaws.com'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda function creation
  myLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt myLambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            console.log("Event: ", JSON.stringify(event));
            return {
              statusCode: 200,
              headers: {
                "Access-Control-Allow-Origin": process.env.ALLOWED_ORIGIN,
              },
              body: "Hello from Lambda"
            };
          };
      Environment:
        Variables:
          TABLE_NAME: !Ref myDynamoDB
          SNS_TOPIC_ARN: !Ref MySNSTopic
          ALLOWED_ORIGIN: !Sub "https://${myPortfolioContentS3bucket}.s3-website-${AWS::Region}.amazonaws.com"

  myLambdaPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref myLambdaFunction
      Principal: apigateway.amazonaws.com

  # API Gateway deployment and stage
  myAPIDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref RestAPI
      Description: !Sub "Deployment - ${AWS::StackName} - ${AWS::Region}"
    DependsOn:
      - myPOSTMethod
      - myOPTIONMethod

  myAPIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestAPI
      DeploymentId: !Ref myAPIDeployment
      StageName: prod

  # DynamoDB Table
  myDynamoDB:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # SNS Topic for email notification
  MySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: "raseefaz@gmail.com"
          Protocol: email

  # IAM Role for Lambda Execution
  myLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: inlineForDynamoDbAndSnsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBPutItem
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt myDynamoDB.Arn
              - Sid: SNSemail
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref MySNSTopic

  # S3 bucket creation and policy for front end data to be saved on
  myPortfolioContentS3bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      WebsiteConfiguration:
        IndexDocument: index.html
        # ErrorDocument: error.html

  myS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref myPortfolioContentS3bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - "s3:GetObject"
            Effect: Allow
            Principal: "*"
            Resource: !Sub "arn:aws:s3:::${myPortfolioContentS3bucket}/*"

  #S3 bucket for running code for lambda

  myLambdacontentS3bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  myLambdacontentS3bucketpolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref myLambdacontentS3bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: forMyLambdaBucket
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - cloudformation.amazonaws.com
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
            Resource: !Sub "arn:aws:s3:::${myLambdacontentS3bucket}/*"

  # OIDC IAM Role for GitHub Actions
  myOIDCIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myS3AccessRoleForGitHubActions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:sub: "repo:RaseefAzeez/myportfolio_project:ref:refs/heads/main"
      Policies:
        - PolicyName: S3AccessForGitHubActions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                Resource: !Sub "arn:aws:s3:::${myPortfolioContentS3bucket}/*"

  # CloudFormation Execution Role
  myCFTExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: myCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  WebsiteURL:
    Value: !GetAtt myPortfolioContentS3bucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteURL"
